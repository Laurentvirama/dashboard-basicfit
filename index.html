<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Cluster Manager - Basic-Fit</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preconnect" href="https://www.gstatic.com"><link rel="preconnect" href="https://firestore.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A1628">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dashboard BF">
<link rel="apple-touch-icon" href="icon-192.png">
<!-- Firebase SDK (compat, no build step needed) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAK9lHaA7vEO0Q-IyVA4kZLAiottRQ5ItM",
  authDomain: "dashboard-basicfit.firebaseapp.com",
  databaseURL: "https://dashboard-basicfit-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "dashboard-basicfit",
  storageBucket: "dashboard-basicfit.firebasestorage.app",
  messagingSenderId: "191052369797",
  appId: "1:191052369797:web:c2158202e8f83dcabdfeec"
};
firebase.initializeApp(firebaseConfig);
const firestoreDB = firebase.firestore();
try{
  firestoreDB.enablePersistence({synchronizeTabs:true}).catch(function(err){console.log("Persistence offline non activée:",err.code)});
}catch(e){}
</script>
</head>
<body>

<!-- ÉCRAN DE CONNEXION (le dashboard reste caché tant que l'utilisateur n'est pas identifié) -->
<div id="loginScreen" style="position:fixed;inset:0;background:linear-gradient(135deg,#0B2E2B,#0D9488);display:flex;align-items:center;justify-content:center;z-index:5000;padding:20px">
  <div style="background:#fff;border-radius:16px;padding:32px 28px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center">
    <div style="width:56px;height:56px;border-radius:14px;background:#0D9488;color:#fff;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px">BF</div>
    <div style="font-size:20px;font-weight:700;color:#1A1D23">Cluster Manager</div>
    <div style="font-size:13px;color:#6B7280;margin:6px 0 22px">Accès réservé · connecte-toi pour ouvrir le dashboard</div>
    <button onclick="loginWithGoogle()" style="width:100%;padding:12px;border:1px solid #E5E7EB;border-radius:10px;background:#fff;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.6 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.3l7.8 6C12.3 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.2 5.5-4.7 7.2l7.5 5.8c4.4-4 7-10 7-17.5z"/><path fill="#FBBC05" d="M10.4 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.8-6A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.7l7.8-6z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.7-4.1-13.6-9.8l-7.8 6C6.5 42.6 14.6 48 24 48z"/></svg>Continuer avec Google</button>
    <div style="display:flex;align-items:center;gap:10px;margin:16px 0;color:#9CA3AF;font-size:11px"><div style="flex:1;height:1px;background:#E5E7EB"></div>ou<div style="flex:1;height:1px;background:#E5E7EB"></div></div>
    <input id="loginEmail" type="email" placeholder="Email" autocomplete="username" style="width:100%;padding:11px 12px;border:1px solid #E5E7EB;border-radius:10px;font-size:14px;margin-bottom:8px">
    <input id="loginPwd" type="password" placeholder="Mot de passe" autocomplete="current-password" style="width:100%;padding:11px 12px;border:1px solid #E5E7EB;border-radius:10px;font-size:14px;margin-bottom:10px" onkeydown="if(event.key==='Enter')loginWithEmail()">
    <button onclick="loginWithEmail()" style="width:100%;padding:12px;border:none;border-radius:10px;background:#0D9488;color:#fff;font-size:14px;font-weight:600;cursor:pointer">Se connecter</button>
    <div id="loginError" style="color:#DC2626;font-size:12px;margin-top:12px;min-height:16px"></div>
    <div style="font-size:11px;color:#9CA3AF;margin-top:14px">Données protégées par Firebase Authentication · seuls les comptes autorisés peuvent lire et écrire.</div>
  </div>
</div>

<div class="header">
  <div class="header-left">
    <div class="logo">BF</div>
    <div><div class="header-title">Cluster Manager</div><div class="header-sub">5 clubs · Seine-et-Marne · 🏠 Meaux Victoire</div></div>
  </div>
  <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
    <div class="header-date" id="headerDate"></div>
    <div class="header-actions">
      <div class="save-indicator" id="saveIndicator" style="background:rgba(22,163,74,.12);color:#16A34A">✓ Sauvegardé</div>
      <button class="btn-export" onclick="requestNotifPermission()" id="notifPermBtn" title="Activer les notifications">🔕</button>
      <button class="btn-export" onclick="toggleNotifPanel()" id="notifBtn">🔔 <span id="notifBadgeHeader"></span></button>
      <button class="btn-export" onclick="activeTab='imports';render()" title="Importer un fichier Excel">📥 Import</button>
      <button class="btn-export" onclick="exportTicketsExcel()" title="Export Excel tickets">📊 Excel Tickets</button>
      <button class="btn-export" onclick="exportFullReportExcel()" title="Export rapport complet">📊 Excel Complet</button>
      <button class="btn-export" onclick="exportStatsEmail()" title="Envoyer par email">✉ Email</button>
      <button class="btn-export" onclick="window.print()" title="Imprimer/PDF">🖨 PDF</button>
      <button class="btn-export" onclick="exportStatsText()" title="Copier">📋 Copier</button>
      <button class="btn-export" onclick="logoutDashboard()" id="logoutBtn" title="Se déconnecter">🔒</button>
    </div>
  </div>
</div>
<div class="tabs" id="tabsContainer"></div>
<div class="filters" id="filtersContainer"></div>
<div class="content" id="contentArea"></div>
<div id="modalContainer"></div>
<div id="toastContainer" style="position:fixed;bottom:20px;right:20px;z-index:2000"></div>

<!-- NOTIFICATION PANEL -->
<div class="notif-panel" id="notifPanel">
  <div class="notif-panel-header">
    <h3>🔔 Notifications</h3>
    <div style="display:flex;gap:6px">
      <button class="btn-secondary" onclick="markAllNotifRead()" style="font-size:11px">Tout lire</button>
      <button class="btn-danger" onclick="toggleNotifPanel()" style="font-size:14px;padding:4px 8px">✕</button>
    </div>
  </div>
  <div id="notifList"></div>
</div>

<script src="absences.js"></script>
<script src="prestataires.js"></script>
<script src="app.js"></script>
</body>
</html>
